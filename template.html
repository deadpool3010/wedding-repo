<title>Krishna &amp; Pramey</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description"
  content="Wedding invitation of Dr. Krishna Chauhan and Dr. Pramey Gohil · 30–31 January 2027 · Vadodara">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Jost:wght@400;500;600&family=Pinyon+Script&display=swap">
<style>
  /* Layout: one phone-width invitation column; full-bleed painted bands per screen; sticky stacking event cards. */
  :root {
    color-scheme: light;
    --ivory: #FBF6EC;
    --parchment: #F4EADA;
    --card: #FFFBF3;
    --ink: #3B2A23;
    --ink-soft: #6E5A4E;
    --mauve: #8C6E68;
    --mauve-deep: #5C4440;
    --mauve-tint: #E9DCD6;
    --sage: #7E8B62;
    --sage-deep: #4E5A3A;
    --sage-tint: #E3E6D3;
    --gold: #B4863A;
    --gold-soft: #DDBB75;
    --gold-pale: #F1E2BC;
    --maroon: #7A1F33;
    --marigold: #F3A225;
    --saffron: #E5661B;
    --rose: #E58BA6;
    --sky-1: #CFE3F1;
    --sky-2: #EEF4F6;
    --water-1: #8ED4E8;
    --water-2: #4FB2D3;
    --f-script: "Pinyon Script", "Snell Roundhand", "Apple Chancery", cursive;
    --f-serif: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
    --f-label: "Jost", "Avenir Next", "Segoe UI", system-ui, sans-serif;
    --col: 560px;
  }

  * {
    box-sizing: border-box
  }

  html {
    scroll-behavior: smooth
  }

  html.locked,
  html.locked body {
    overflow: hidden;
    height: 100%
  }

  body {
    margin: 0;
    background: var(--ivory);
    color: var(--ink);
    font-family: var(--f-serif);
    font-size: 19px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden
  }

  img {
    max-width: 100%
  }

  button {
    font: inherit;
    color: inherit
  }

  a {
    color: inherit
  }

  :focus-visible {
    outline: 2px solid var(--maroon);
    outline-offset: 3px;
    border-radius: 6px
  }

  .wrap {
    width: 100%;
    max-width: var(--col);
    margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px))
  }

  .eyebrow {
    font-family: var(--f-label);
    font-weight: 600;
    font-size: .72rem;
    letter-spacing: .32em;
    text-transform: uppercase;
    color: var(--gold)
  }

  .script {
    font-family: var(--f-script);
    font-weight: 400;
    line-height: 1
  }

  .rule {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: var(--gold)
  }

  .rule::before,
  .rule::after {
    content: "";
    height: 1px;
    width: 64px;
    background: linear-gradient(90deg, transparent, var(--gold-soft))
  }

  .rule::after {
    transform: scaleX(-1)
  }

  .rule svg {
    width: 16px;
    height: 16px
  }

  h2 {
    font-family: var(--f-serif);
    font-style: italic;
    font-weight: 500;
    font-size: clamp(2.4rem, 10vw, 3.3rem);
    line-height: 1.05;
    margin: .2em 0 .15em;
    color: var(--mauve-deep);
    text-wrap: balance
  }

  .lede {
    color: var(--ink-soft);
    font-size: 1.05rem;
    max-width: 34ch;
    margin: 0 auto;
    text-wrap: balance
  }

  .center {
    text-align: center
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-family: var(--f-label);
    font-weight: 600;
    font-size: .74rem;
    letter-spacing: .22em;
    text-transform: uppercase;
    text-decoration: none;
    padding: 15px 24px;
    border-radius: 999px;
    border: 1px solid var(--gold);
    cursor: pointer;
    transition: transform .2s, box-shadow .2s, background .2s
  }

  .btn svg {
    width: 16px;
    height: 16px;
    flex: none
  }

  .btn-solid {
    background: var(--mauve-deep);
    color: #FFF6E6;
    box-shadow: 0 8px 20px -10px rgba(92, 68, 64, .8)
  }

  .btn-solid:hover {
    transform: translateY(-1px);
    box-shadow: 0 12px 26px -12px rgba(92, 68, 64, .9)
  }

  .btn-ghost {
    background: transparent;
    color: var(--mauve-deep)
  }

  .btn-ghost:hover {
    background: var(--gold-pale)
  }

  /* reveal: visible by default; hidden only once JS is ready */
  html.js .reveal {
    opacity: 0;
    transform: translateY(26px);
    transition: opacity .9s ease, transform .9s cubic-bezier(.2, .7, .2, 1)
  }

  html.js .reveal.in {
    opacity: 1;
    transform: none
  }

  /* ============ GATE ============ */
  .gate {
    position: fixed;
    inset: 0;
    z-index: 60;
    overflow: hidden;
    cursor: pointer;
    background: radial-gradient(120% 60% at 50% 30%, #fff 0%, transparent 60%), linear-gradient(180deg, var(--sky-1) 0%, var(--sky-2) 46%, #FBEFDB 74%, #F7E2C4 100%);
    transition: transform 1.3s cubic-bezier(.6, 0, .3, 1), opacity 1.1s ease .25s
  }

  .gate.zoom {
    transform: scale(2.8);
    opacity: 0
  }

  .gate .speck {
    position: absolute;
    border-radius: 50%;
    background: #fff;
    opacity: .7;
    animation: twinkle 4s ease-in-out infinite
  }

  @keyframes twinkle {
    50% {
      opacity: .15
    }
  }

  .gate-invocation {
    position: absolute;
    top: calc(env(safe-area-inset-top, 0px) + 5.5%);
    left: 0;
    right: 0;
    text-align: center;
    font-family: var(--f-serif);
    font-size: 1.05rem;
    color: var(--mauve-deep);
    letter-spacing: .06em
  }

  .gate-mandala {
    position: absolute;
    left: 50%;
    top: 29%;
    width: min(92vw, 400px);
    aspect-ratio: 1;
    transform: translate(-50%, -50%);
    opacity: .55;
    animation: spin 90s linear infinite
  }

  @keyframes spin {
    to {
      transform: translate(-50%, -50%) rotate(360deg)
    }
  }

  .medallion {
    position: absolute;
    left: 50%;
    top: 29%;
    transform: translate(-50%, -50%);
    width: min(64vw, 264px);
    aspect-ratio: 1;
    border-radius: 50%;
    border: 2px solid var(--gold);
    background: radial-gradient(circle at 50% 40%, #fffdf8 0%, #fbf3e3 70%, #f3e4c6 100%);
    box-shadow: 0 0 0 7px rgba(255, 255, 255, .55), 0 0 0 8px rgba(180, 134, 58, .35), 0 24px 60px -20px rgba(120, 80, 30, .45);
    display: grid;
    place-items: center;
    align-content: center;
    gap: 6px;
    cursor: pointer;
    padding: 0;
    transition: transform .5s ease, opacity .5s ease
  }

  .medallion::after {
    content: "";
    position: absolute;
    inset: -14px;
    border-radius: 50%;
    border: 1px solid var(--gold-soft);
    animation: pulse 2.4s ease-out infinite
  }

  @keyframes pulse {
    0% {
      transform: scale(.94);
      opacity: .9
    }

    100% {
      transform: scale(1.18);
      opacity: 0
    }
  }

  .medallion .om {
    width: 26px;
    height: 26px;
    color: var(--gold)
  }

  .medallion .ini {
    font-family: var(--f-serif);
    font-style: italic;
    font-weight: 600;
    font-size: clamp(3.2rem, 15vw, 4.4rem);
    line-height: 1;
    color: var(--ink);
    letter-spacing: -.02em
  }

  .medallion .ini b {
    font-weight: 500;
    color: var(--gold);
    font-size: .62em;
    margin: 0 .06em
  }

  .medallion .bar {
    width: 42%;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent)
  }

  .medallion .tap {
    font-family: var(--f-label);
    font-weight: 600;
    font-size: .68rem;
    letter-spacing: .38em;
    color: var(--gold);
    padding-left: .38em
  }

  .gate.opening .medallion {
    transform: translate(-50%, -50%) scale(.7);
    opacity: 0
  }

  .gate.opening .gate-mandala,
  .gate.opening .gate-invocation {
    opacity: 0;
    transition: opacity .5s
  }

  .scene {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 58%;
    pointer-events: none
  }

  .palace {
    position: absolute;
    left: 50%;
    bottom: 13%;
    width: min(108vw, 600px);
    transform: translateX(-50%)
  }

  .palace .door {
    transform-box: fill-box;
    transition: transform 1.1s cubic-bezier(.5, 0, .2, 1)
  }

  .palace .door-l {
    transform-origin: left center
  }

  .palace .door-r {
    transform-origin: right center
  }

  .gate.opening .palace .door {
    transform: scaleX(.06)
  }

  .palace .glow {
    opacity: .55;
    transition: opacity 1s
  }

  .gate.opening .palace .glow {
    opacity: 1
  }

  .plant {
    position: absolute;
    bottom: 12%;
    width: min(40vw, 220px);
    transform-origin: 50% 100%
  }

  .plant.l {
    left: -6%;
    animation: sway 7s ease-in-out infinite
  }

  .plant.r {
    right: -6%;
    transform: scaleX(-1);
    animation: swayR 8s ease-in-out infinite
  }

  @keyframes sway {
    50% {
      transform: rotate(-2.4deg)
    }
  }

  @keyframes swayR {

    0%,
    100% {
      transform: scaleX(-1)
    }

    50% {
      transform: scaleX(-1) rotate(-2.4deg)
    }
  }

  .pond {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 15%;
    background: linear-gradient(180deg, var(--water-1), var(--water-2));
    overflow: hidden
  }

  .pond::before {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    height: 6px;
    background: rgba(255, 255, 255, .55)
  }

  .waves {
    position: absolute;
    left: 0;
    width: 200%;
    height: 28px;
    background-repeat: repeat-x;
    background-size: 240px 28px;
    animation: drift 14s linear infinite;
    opacity: .8
  }

  .waves.w1 {
    top: 22%
  }

  .waves.w2 {
    top: 58%;
    animation-duration: 20s;
    animation-direction: reverse;
    opacity: .55
  }

  @keyframes drift {
    to {
      transform: translateX(-240px)
    }
  }

  .lotus {
    position: absolute;
    bottom: 3%;
    width: 72px
  }

  .lotus.a {
    right: 9%;
    width: 86px
  }

  .lotus.b {
    left: 12%;
    bottom: 6%;
    width: 54px
  }

  .gate-hint {
    position: absolute;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 2.2%);
    left: 0;
    right: 0;
    text-align: center;
    font-family: var(--f-label);
    font-size: .66rem;
    letter-spacing: .3em;
    text-transform: uppercase;
    color: #fff;
    opacity: .9;
    z-index: 2
  }

  /* ============ HERO ============ */
  .hero {
    position: relative;
    overflow: hidden;
    background: linear-gradient(180deg, #EAF2F6 0%, var(--ivory) 58%);
    padding-block: 0 0
  }

  .toran {
    height: 74px;
    background-repeat: repeat-x;
    background-size: 96px 74px;
    background-position: center top;
    position: relative;
    z-index: 2
  }

  .ladi {
    position: absolute;
    top: 0;
    width: 22px;
    z-index: 2
  }

  .ladi.l {
    left: max(6px, env(safe-area-inset-left, 0px))
  }

  .ladi.r {
    right: max(6px, env(safe-area-inset-right, 0px))
  }

  .hero-mandala {
    position: absolute;
    left: 50%;
    top: 180px;
    width: min(120vw, 640px);
    aspect-ratio: 1;
    transform: translateX(-50%);
    opacity: .22;
    pointer-events: none
  }

  .hero-inner {
    position: relative;
    z-index: 1;
    text-align: center;
    padding-block: 28px 40px;
    display: grid;
    gap: 18px;
    justify-items: center
  }

  .blessing {
    font-size: 1rem;
    color: var(--mauve);
    font-style: italic
  }

  .names {
    display: grid;
    gap: 4px;
    justify-items: center;
    margin-top: 4px
  }

  .names .script {
    font-size: clamp(4rem, 20vw, 6.2rem);
    color: var(--mauve-deep);
    padding: 0 .1em
  }

  .names .amp {
    font-family: var(--f-serif);
    font-style: italic;
    font-size: 2.4rem;
    color: var(--gold);
    line-height: 1
  }

  .names small {
    display: block;
    font-family: var(--f-label);
    font-size: .66rem;
    letter-spacing: .24em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-top: 6px
  }

  .parents {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    width: 100%;
    max-width: 440px;
    font-size: .92rem;
    color: var(--ink-soft);
    font-style: italic
  }

  .parents div {
    min-width: 0
  }

  .date-chip {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    font-family: var(--f-label);
    font-weight: 500;
    font-size: .8rem;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--mauve-deep);
    padding: 10px 20px;
    border-top: 1px solid var(--gold-soft);
    border-bottom: 1px solid var(--gold-soft)
  }

  .venue-line {
    font-family: var(--f-label);
    font-weight: 600;
    font-size: .78rem;
    letter-spacing: .3em;
    text-transform: uppercase;
    color: var(--gold)
  }

  .venue-line span {
    display: block;
    margin-top: 6px;
    color: var(--mauve-deep);
    font-weight: 500;
    letter-spacing: .24em;
    font-size: .68rem
  }

  .scroll-cue {
    display: grid;
    justify-items: center;
    gap: 6px;
    margin-top: 10px;
    font-family: var(--f-label);
    font-size: .62rem;
    letter-spacing: .3em;
    text-transform: uppercase;
    color: var(--mauve);
    text-decoration: none
  }

  .scroll-cue i {
    width: 22px;
    height: 36px;
    border: 1.5px solid var(--mauve);
    border-radius: 12px;
    position: relative
  }

  .scroll-cue i::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 7px;
    width: 3px;
    height: 7px;
    margin-left: -1.5px;
    border-radius: 2px;
    background: var(--mauve);
    animation: wheel 1.8s ease-in-out infinite
  }

  @keyframes wheel {
    60% {
      transform: translateY(10px);
      opacity: 0
    }

    100% {
      opacity: 0
    }
  }

  .arches {
    height: 64px;
    background-repeat: repeat-x;
    background-size: 64px 64px;
    background-position: center bottom
  }

  /* ============ COUNTDOWN ============ */
  .countdown {
    background: var(--parchment);
    padding-block: 56px 72px;
    position: relative
  }

  .countdown .wrap {
    display: grid;
    gap: 14px;
    justify-items: center;
    text-align: center
  }

  .scratch {
    position: relative;
    width: 100%;
    max-width: 420px;
    margin-top: 18px;
    border-radius: 200px 200px 26px 26px / 150px 150px 26px 26px;
    background: var(--card);
    border: 1px solid var(--gold-soft);
    box-shadow: 0 0 0 6px var(--card), 0 0 0 7px var(--gold-soft), 0 30px 60px -30px rgba(92, 68, 64, .5);
    overflow: hidden
  }

  .scratch-body {
    padding: 64px 18px 30px;
    display: grid;
    gap: 18px;
    justify-items: center
  }

  .scratch-body .eyebrow {
    color: var(--sage-deep)
  }

  .units {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    width: 100%
  }

  .unit {
    display: grid;
    gap: 2px;
    justify-items: center;
    padding: 12px 2px;
    border-radius: 14px;
    background: var(--sage-tint)
  }

  .unit b {
    font-family: var(--f-serif);
    font-weight: 600;
    font-size: clamp(2rem, 9vw, 2.7rem);
    line-height: 1;
    color: var(--sage-deep);
    font-variant-numeric: tabular-nums lining-nums
  }

  .unit span {
    font-family: var(--f-label);
    font-size: .58rem;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--ink-soft)
  }

  .unit.rolling b {
    color: var(--gold)
  }

  .target-label {
    font-size: .95rem;
    color: var(--ink-soft);
    font-style: italic;
    max-width: 30ch
  }

  .today {
    display: none;
    font-family: var(--f-script);
    font-size: 2.6rem;
    color: var(--maroon)
  }

  .scratch.done-day .today {
    display: block
  }

  .scratch canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    touch-action: none;
    cursor: grab;
    transition: opacity .8s ease
  }

  .scratch.revealed canvas {
    opacity: 0;
    pointer-events: none
  }

  .reveal-alt {
    background: none;
    border: 0;
    font-family: var(--f-label);
    font-size: .68rem;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--mauve);
    text-decoration: underline;
    text-underline-offset: 4px;
    cursor: pointer;
    padding: 8px
  }

  .scratch.revealed+.reveal-alt {
    visibility: hidden
  }

  /* ============ EVENTS ============ */
  .events {
    position: relative;
    background: linear-gradient(180deg, var(--ivory), #F8EFE1);
    padding-block: 0 80px;
    overflow: clip
  }

  .diyas {
    position: relative;
    height: 190px;
    max-width: var(--col);
    margin: 0 auto
  }

  .diya-hang {
    position: absolute;
    top: 0;
    display: grid;
    justify-items: center;
    transform-origin: 50% 0;
    animation: swing 5s ease-in-out infinite
  }

  .diya-hang .chain {
    width: 2px;
    background: repeating-linear-gradient(180deg, var(--gold) 0 6px, transparent 6px 9px)
  }

  .diya-hang svg {
    width: 48px
  }

  @keyframes swing {

    0%,
    100% {
      transform: rotate(2deg)
    }

    50% {
      transform: rotate(-2deg)
    }
  }

  .flame {
    transform-origin: 50% 100%;
    animation: flicker .18s ease-in-out infinite alternate
  }

  @keyframes flicker {
    to {
      transform: scaleY(1.1) scaleX(.93)
    }
  }

  .events-head {
    text-align: center;
    display: grid;
    gap: 8px;
    justify-items: center;
    margin-top: -30px;
    margin-bottom: 34px
  }

  .stack {
    display: grid;
    gap: 28px
  }

  .ev {
    position: relative;
    border-radius: 240px 240px 28px 28px / 170px 170px 28px 28px;
    padding: 12px;
    background: var(--pal);
    box-shadow: 0 30px 60px -34px rgba(60, 40, 30, .6);
    transform-origin: 50% 0;
    will-change: transform
  }

  .ev.sticky {
    position: sticky
  }

  .ev[data-palette="sage"] {
    --pal: linear-gradient(160deg, #93A07A, #6E7B55);
    --accent: var(--sage-deep);
    --tint: var(--sage-tint)
  }

  .ev[data-palette="mauve"] {
    --pal: linear-gradient(160deg, #A3857E, #7C605A);
    --accent: var(--mauve-deep);
    --tint: var(--mauve-tint)
  }

  .ev-inner {
    position: relative;
    border-radius: 228px 228px 20px 20px / 160px 160px 20px 20px;
    background: var(--card);
    padding: 62px 22px 26px;
    display: grid;
    gap: 14px;
    justify-items: center;
    text-align: center;
    overflow: hidden
  }

  .ev-inner::before {
    content: "";
    position: absolute;
    inset: 8px;
    border: 1px solid var(--gold-soft);
    border-radius: inherit;
    pointer-events: none
  }

  .ev-num {
    position: absolute;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    font-family: var(--f-label);
    font-weight: 600;
    font-size: .62rem;
    letter-spacing: .3em;
    color: var(--gold);
    background: var(--card);
    padding: 0 10px;
    z-index: 1
  }

  .ev-icon {
    width: 62px;
    height: 62px;
    color: var(--accent)
  }

  .ev h3 {
    margin: 0;
    font-family: var(--f-serif);
    font-style: italic;
    font-weight: 600;
    font-size: clamp(1.9rem, 8vw, 2.35rem);
    line-height: 1.08;
    color: var(--ink);
    text-wrap: balance
  }

  .ev-day {
    font-family: var(--f-label);
    font-weight: 600;
    font-size: .7rem;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--accent)
  }

  .sched {
    list-style: none;
    margin: 2px 0 0;

<script>
  (function () {
    "use strict";

    /**
     * Auspicious Indian Wedding Audio Synthesizer & Player
     * Uses Web Audio API to create authentic serene Indian Classical wedding instruments (Sitar / Shehnai / Tanpura / Temple Chimes)
     * 100% self-contained, no external mp3 dependencies needed, zero latency!
     */
    class WeddingAudioSystem {
      constructor() {
        this.ctx = null;
        this.isPlaying = false;
        this.isMuted = false;
        this.masterGain = null;
        this.droneGain = null;
        this.droneNodes = [];
        this.melodyTimer = null;
        this.melodyStep = 0;
        this._wasPlayingBeforeHide = false;
        this.audioEl = null;

        // Traditional Indian Raga (Yaman / Bilawal auspicious wedding scale)
        // Sa, Re, Ga, Ma, Pa, Dha, Ni, Sa' (frequencies in Hz around C#4 / D4)
        this.ragaNotes = [
          277.18, // Sa  (C#4)
          311.13, // Re  (D#4)
          349.23, // Ga  (F4)
          369.99, // Ma  (F#4)
          415.30, // Pa  (G#4)
          466.16, // Dha (A#4)
          523.25, // Ni  (C5)
          554.37  // Sa' (C#5)
        ];

        // Auspicious melody sequence (traditional Indian Shehnai / Sitar pattern)
        this.melodyPhrase = [
          0, 1, 2, 4, 2, 1, 0, 4,
          4, 5, 6, 7, 6, 5, 4, 2,
          2, 4, 5, 4, 2, 1, 0, -1,
          0, 2, 4, 7, 6, 4, 2, 0
        ];
      }

      setAudioSrc(src) {
        if (src && src.trim()) {
          try {
            this.audioEl = new Audio(src.trim());
            this.audioEl.loop = true;
            this.audioEl.preload = "auto";
          } catch (e) { }
        }
      }

      initContext() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          this.ctx = new AudioCtx();

          this.masterGain = this.ctx.createGain();
          this.masterGain.gain.setValueAtTime(0.0001, this.ctx.currentTime);
          this.masterGain.connect(this.ctx.destination);
        }
        if (this.ctx && this.ctx.state === "suspended") {
          this.ctx.resume();
        }
      }

      startMusic() {
        if (this.audioEl) {
          this.isPlaying = true;
          this.audioEl.play().then(() => {
            this.updateUI();
          }).catch(() => {
            this.audioEl = null;
            this.startSynthMusic();
          });
          this.updateUI();
          return;
        }
        this.startSynthMusic();
      }

      startSynthMusic() {
        this.initContext();
        if (!this.ctx) return;
        if (this.isPlaying) return;

        this.isPlaying = true;
        this.isMuted = false;

        // Gentle fade in
        try {
          const now = this.ctx.currentTime;
          this.masterGain.gain.cancelScheduledValues(now);
          this.masterGain.gain.setValueAtTime(Math.max(0.0001, this.masterGain.gain.value), now);
          this.masterGain.gain.exponentialRampToValueAtTime(0.35, now + 2.5);
        } catch (e) { }

        this.startTanpuraDrone();
        this.startMelodyLoop();
        this.updateUI();
      }

      stopMusic() {
        if (!this.isPlaying) return;
        this.isPlaying = false;

        if (this.audioEl) {
          try { this.audioEl.pause(); } catch (e) { }
          this.updateUI();
          return;
        }

        if (this.masterGain && this.ctx) {
          try {
            const now = this.ctx.currentTime;
            this.masterGain.gain.cancelScheduledValues(now);
            this.masterGain.gain.setValueAtTime(Math.max(0.0001, this.masterGain.gain.value), now);
            this.masterGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.8);
          } catch (e) { }
        }
        if (this.melodyTimer) {
          clearTimeout(this.melodyTimer);
          this.melodyTimer = null;
        }
        setTimeout(() => {
          if (!this.isPlaying) {
            this.stopTanpuraDrone();
          }
        }, 850);
        this.updateUI();
      }

      toggleMusic() {
        if (this.isPlaying) {
          this.stopMusic();
        } else {
          this.startMusic();
        }
      }

      stopTanpuraDrone() {
        if (this.droneNodes && this.droneNodes.length) {
          this.droneNodes.forEach(node => {
            try {
              node.stop();
              node.disconnect();
            } catch (e) { }
          });
        }
        this.droneNodes = [];
      }

      startTanpuraDrone() {
        if (!this.ctx) return;
        this.stopTanpuraDrone();

        const baseFreq = 138.59; // Sa (C#3)
        const fifthFreq = 207.65; // Pa (G#3)

        // Tanpura Sa & Pa strings with rich harmonics
        [baseFreq, baseFreq * 2, fifthFreq].forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const filter = this.ctx.createBiquadFilter();

          osc.type = idx === 1 ? 'sawtooth' : 'triangle';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);

          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(650, this.ctx.currentTime);

          gain.gain.setValueAtTime(0.08 / (idx + 1), this.ctx.currentTime);

          osc.connect(filter);
          filter.connect(gain);
          gain.connect(this.masterGain);
          osc.start();

          this.droneNodes.push(osc);
        });
      }

      startMelodyLoop() {
        if (this.melodyTimer) {
          clearTimeout(this.melodyTimer);
          this.melodyTimer = null;
        }
        let noteIndex = 0;
        const playNext = () => {
          if (!this.isPlaying || !this.ctx) return;

          const scaleDeg = this.melodyPhrase[noteIndex % this.melodyPhrase.length];
          noteIndex++;

          if (scaleDeg >= 0) {
            const freq = this.ragaNotes[scaleDeg];
            this.playShehnaiNote(freq, 0.45);
          }

          // Tempo: soft classical rhythm ~420ms per note
          this.melodyTimer = setTimeout(playNext, 420);
        };

        playNext();

      playShehnaiNote(freq, duration = 0.5) {
        if (!this.ctx || !this.isPlaying) return;

        try {
          const osc1 = this.ctx.createOscillator();
          const osc2 = this.ctx.createOscillator();
          const noteGain = this.ctx.createGain();
          const filter = this.ctx.createBiquadFilter();

          // Shehnai reedy timbre (mix of triangle + square with vibrato)
          osc1.type = 'sawtooth';
          osc2.type = 'sine';

          const now = this.ctx.currentTime;
          osc1.frequency.setValueAtTime(freq, now);
          osc2.frequency.setValueAtTime(freq * 1.002, now);

          // Subtle pitch bend (Meend) characteristic of Indian classical music
          osc1.frequency.exponentialRampToValueAtTime(freq * 1.008, now + 0.15);
          osc1.frequency.exponentialRampToValueAtTime(freq, now + duration);

          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(freq * 2.2, now);
          filter.Q.setValueAtTime(2.5, now);

          noteGain.gain.setValueAtTime(0.0001, now);
          noteGain.gain.exponentialRampToValueAtTime(0.18, now + 0.08);
          noteGain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

          osc1.connect(filter);
          osc2.connect(filter);
          filter.connect(noteGain);
          noteGain.connect(this.masterGain);

          osc1.start(now);
          osc2.start(now);
          osc1.stop(now + duration + 0.05);
          osc2.stop(now + duration + 0.05);

          osc1.onended = () => {
            try {
              osc1.disconnect();
              osc2.disconnect();
              filter.disconnect();
              noteGain.disconnect();
            } catch (e) { }
          };
        } catch (e) { }
      }

          const chimeFreqs = [587.33, 880, 1174.66, 1760]; // D-maj harmonics
          chimeFreqs.forEach((freq, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();

            osc.type = 'sine';
            const now = this.ctx.currentTime + i * 0.04;
            osc.frequency.setValueAtTime(freq, now);

            gain.gain.setValueAtTime(0.0001, now);
            gain.gain.exponentialRampToValueAtTime(0.15 / (i + 1), now + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 2.2);

            osc.connect(gain);
            gain.connect(this.ctx.destination);

            osc.stop(now + 2.3);

            osc.onended = () => {

                osc.disconnect();
                gain.disconnect();

            };

      $("#g-ini").innerHTML = `${esc(S.opening.initialOne)}<b>&amp;</b>${esc(S.opening.initialTwo)}`;

      // hero
      const H = S.hero;
      $("#h-blessing").textContent = H.blessing;
      $("#h-eyebrow").textContent = H.eyebrow;
      $("#h-bride").textContent = C.bride.name; $("#h-bride-c").textContent = `Dr. · ${C.bride.credentials}`;
      $("#h-groom").textContent = C.groom.name; $("#h-groom-c").textContent = `Dr. · ${C.groom.credentials}`;
      $("#h-bp").textContent = C.bride.parents; $("#h-gp").textContent = C.groom.parents;
      $("#h-intro").textContent = H.intro + " " + H.invite;
      $("#h-date").textContent = H.dateLine;
      $("#h-venue").innerHTML = `${esc(H.venue.name)}<span>${esc(H.venue.city)}</span>`;
      $("#h-map").href = H.venue.mapUrl; $("#h-map span").textContent = H.locationLabel;
      if (H.backgroundImage) $("#hero").style.backgroundImage = `url("${H.backgroundImage}")`;

      // countdown
      const K = S.countdown;
      $("#c-eyebrow").textContent = K.eyebrow; $("#c-title").textContent = K.title;
      $("#c-target").textContent = K.targetLabel; $("#c-today").textContent = K.celebrationText;
      $("#units").innerHTML = K.units.map(u => `<div class="unit"><b>00</b><span>${esc(u)}</span></div>`).join("");

      // events
      const E = S.events;
      $("#e-eyebrow").textContent = E.eyebrow; $("#e-title").textContent = E.title; $("#e-intro").textContent = E.intro;
      $("#stack").innerHTML = E.items.map((ev, i) => `
    <article class="ev" data-palette="${esc(ev.palette)}" style="--i:${i}" id="ev-${esc(ev.id)}">
      <div class="ev-inner">
        <span class="ev-num">EVENT ${String(i + 1).padStart(2, "0")}</span>
        <div class="ev-icon">${ICONS[ev.icon] || ICONS.kalash}</div>
        <div class="ev-day">${esc(ev.dayLabel)}</div>
        <h3>${esc(ev.title)}</h3>
        <ul class="sched">${ev.schedule.map(s => `<li><span>${esc(s.label)}</span><i></i><b>${esc(s.time)}</b></li>`).join("")}</ul>
        ${ev.theme ? `<div class="theme"><small>Dress theme</small><strong>${esc(ev.theme.name)}</strong>${ev.theme.note ? `<em>${esc(ev.theme.note)}</em>` : ""}</div>` : ""}
        ${ev.note ? `<p class="ev-note">${esc(ev.note)}</p>` : ""}
        <div class="venue"><strong>${PIN}${esc(ev.venue.name)}</strong><span>${esc(ev.venue.address)}</span></div>
        <div class="ev-actions">
          <a class="btn btn-solid" href="${esc(ev.venue.mapUrl)}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l18-8-8 18-2-8z"/></svg>Location map</a>
          <a class="btn btn-ghost" href="${esc(gcalUrl(ev.title + " · " + C.bride.name + " & " + C.groom.name, ev.calendar, ev.venue))}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Add to calendar</a>
        </div>
      </div>
    </article>`).join("");

      // blessings
      const B = S.blessings;
      $("#b-eyebrow").textContent = B.eyebrow; $("#b-title").textContent = B.title;
      $("#b-people").innerHTML = B.people.map(p => `<li>${esc(p)}</li>`).join("");
      $("#b-mosad").innerHTML = `<b>Mosad</b>${B.mosad.map(esc).join(" &nbsp;·&nbsp; ")}`;

      // thank you
      const T = S.thankYou;
      $("#t-eyebrow").textContent = T.eyebrow; $("#t-title").textContent = T.title; $("#t-msg").textContent = T.message;
      $("#t-pair").innerHTML = `${esc(C.bride.name)} <span style="font-size:.6em">&amp;</span> ${esc(C.groom.name)}`;
      $("#t-signoff").textContent = T.signoff; $("#t-family").textContent = D.meta.hostFamily;
      const tel = T.from.phone.replace(/[^\d+]/g, "");
      $("#t-from").innerHTML = `<small>${esc(T.from.label)}</small><strong>${esc(T.from.name)}</strong><span>${esc(T.from.address)}</span>
    <div class="phone-row"><a href="tel:${esc(tel)}">${esc(T.from.phone)}</a><button class="copy" id="copyPhone" type="button">Copy</button></div>`;
      $("#t-foot").textContent = `${C.bride.name} & ${C.groom.name} · 31 · 01 · 2027`;
      $("#copyPhone").addEventListener("click", async e => {
        const b = e.currentTarget;
        try { await navigator.clipboard.writeText(T.from.phone); b.textContent = "Copied"; }
        catch (_) { const r = document.createRange(); r.selectNodeContents(document.querySelector(".phone-row a")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = "Selected"; }
        setTimeout(() => b.textContent = "Copy", 1800);
      });

      if (D.music && D.music.src && window.WeddingAudio) {
        window.WeddingAudio.setAudioSrc(D.music.src);
      }
      const mBtn = $("#musicToggleBtn");
      if (mBtn) {
        mBtn.addEventListener("click", e => {
          e.stopPropagation();
          if (window.WeddingAudio) window.WeddingAudio.toggleMusic();
        });
      }
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          if (window.WeddingAudio && window.WeddingAudio.isPlaying) {
            window.WeddingAudio._wasPlayingBeforeHide = true;
            window.WeddingAudio.stopMusic();
          }
        } else {
          if (window.WeddingAudio && window.WeddingAudio._wasPlayingBeforeHide) {
            window.WeddingAudio._wasPlayingBeforeHide = false;
            window.WeddingAudio.startMusic();
          }
        }
      });

      setupGate(); setupScratch(K); setupStack(); setupReveal();
    }

    /* ---------- particles ---------- */
    const fx = $("#fx"), ctx = fx.getContext("2d");
    let parts = [], fxRunning = false;
    function sizeFx() { const d = Math.min(devicePixelRatio || 1, 2); fx.width = innerWidth * d; fx.height = innerHeight * d; ctx.setTransform(d, 0, 0, d, 0, 0); }
    addEventListener("resize", sizeFx); sizeFx();
    const COLORS = ["#F3A225", "#E5661B", "#E58BA6", "#DDBB75", "#FFD27A", "#C9567C", "#fff"];
    function burst({ x = innerWidth / 2, y = innerHeight / 2, n = 120, spread = 1, rain = false } = {}) {
      if (reduce) n = Math.round(n / 5);
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2, v = (4 + Math.random() * 7) * spread;
        parts.push({
          x: rain ? Math.random() * innerWidth : x, y: rain ? -20 - Math.random() * innerHeight * .5 : y,
          vx: rain ? (Math.random() - .5) * 1.2 : Math.cos(a) * v, vy: rain ? 1 + Math.random() * 2 : Math.sin(a) * v - 4,
          r: 4 + Math.random() * 6, rot: Math.random() * 6, vr: (Math.random() - .5) * .2,
          c: COLORS[i % COLORS.length], shape: Math.random() < .6 ? "petal" : "chip", life: 0, max: 220 + Math.random() * 120, sway: Math.random() * 6
        });
      }
      if (!fxRunning) { fxRunning = true; requestAnimationFrame(tick); }
    }
    function tick() {
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      parts = parts.filter(p => p.life < p.max && p.y < innerHeight + 40);
      for (const p of parts) {
        p.life++; p.vy += .12; p.vx *= .985; p.vy = Math.min(p.vy, 2.6);
        p.x += p.vx + Math.sin((p.life + p.sway * 20) / 18) * .6; p.y += p.vy; p.rot += p.vr;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.globalAlpha = Math.min(1, (p.max - p.life) / 40);
        ctx.fillStyle = p.c;
        if (p.shape === "petal") { ctx.beginPath(); ctx.ellipse(0, 0, p.r, p.r * .48, 0, 0, Math.PI * 2); ctx.fill(); }
        else { ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); }
        ctx.restore();
      }
      if (parts.length) requestAnimationFrame(tick); else { fxRunning = false; ctx.clearRect(0, 0, innerWidth, innerHeight); }
    }

    /* ---------- gate ---------- */
    function setupGate() {
      const gate = $("#gate"); let done = false;
      const open = () => {
        if (done) return; done = true;
        if (window.WeddingAudio) {
          window.WeddingAudio.playTempleChime();
          window.WeddingAudio.startMusic();
        }
        const mBtn = $("#musicToggleBtn");
        if (mBtn) mBtn.classList.add("visible");
        const door = gate.querySelector(".glow").getBoundingClientRect();
        gate.style.transformOrigin = `${door.left + door.width / 2}px ${door.top + door.height * .6}px`;
        gate.classList.add("opening");
        setTimeout(() => { gate.classList.add("zoom"); burst({ rain: true, n: 90 }); }, reduce ? 0 : 1050);
        setTimeout(() => {
          gate.remove(); document.documentElement.classList.remove("locked");
          scrollTo(0, 0);
          document.querySelectorAll("#hero .reveal").forEach((el, i) => setTimeout(() => el.classList.add("in"), i * 110));
        }, reduce ? 50 : 2200);
      };
      gate.addEventListener("click", open);
      addEventListener("keydown", e => { if (!done && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); open(); } });
      $("#openBtn").focus({ preventScroll: true });
    }

    /* ---------- reveal on scroll ---------- */
    function setupReveal() {
      const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold: .15 });
      document.querySelectorAll(".reveal").forEach(el => { if (!el.closest("#hero")) io.observe(el); });
      if (!("IntersectionObserver" in window)) document.querySelectorAll(".reveal").forEach(el => el.classList.add("in"));
    }

    /* ---------- scratch + countdown ---------- */
    function setupScratch(K) {
      const card = $("#scratch"), cv = $("#foil"), c = cv.getContext("2d", { willReadFrequently: true });
      const target = new Date(K.target).getTime();
      const nums = [...document.querySelectorAll(".unit b")];
      let revealed = false, drawing = false, last = null, strokes = 0;

      function paint() {
        const r = card.getBoundingClientRect(), d = Math.min(devicePixelRatio || 1, 2);
        cv.width = r.width * d; cv.height = r.height * d; c.setTransform(d, 0, 0, d, 0, 0);
        const g = c.createLinearGradient(0, 0, r.width, r.height);
        g.addColorStop(0, "#C99A45"); g.addColorStop(.35, "#F1D58C"); g.addColorStop(.55, "#B98A3C"); g.addColorStop(.8, "#EBCB7C"); g.addColorStop(1, "#A87A2E");
        c.globalCompositeOperation = "source-over"; c.fillStyle = g; c.fillRect(0, 0, r.width, r.height);
        for (let i = 0; i < 500; i++) { c.fillStyle = `rgba(255,255,255,${Math.random() * .35})`; c.fillRect(Math.random() * r.width, Math.random() * r.height, 1.2, 1.2); }
        c.strokeStyle = "rgba(122,80,24,.35)"; c.lineWidth = 1;
        const cx = r.width / 2, cy = r.height * .44;
        for (let k = 0; k < 3; k++) { c.beginPath(); c.arc(cx, cy, 40 + k * 22, 0, Math.PI * 2); c.stroke(); }
        for (let i = 0; i < 24; i++) { const a = i / 24 * Math.PI * 2; c.beginPath(); c.moveTo(cx + Math.cos(a) * 40, cy + Math.sin(a) * 40); c.lineTo(cx + Math.cos(a) * 84, cy + Math.sin(a) * 84); c.stroke(); }
        c.fillStyle = "#5A3A12"; c.textAlign = "center";
        c.font = `600 13px Jost, sans-serif`; c.fillText(K.scratchHint.toUpperCase().split("").join(String.fromCharCode(8202)), cx, cy + 130);
        c.font = `italic 500 16px "Cormorant Garamond", serif`; c.fillText(K.scratchSub, cx, cy + 154);
        c.font = `400 54px "Pinyon Script", cursive`; c.fillText("K & P", cx, cy + 18);
      }
      document.fonts && document.fonts.ready.then(() => { if (!revealed) paint(); });
      paint();
      addEventListener("resize", () => { if (!revealed) paint(); });

      const pos = e => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
      function scratchAt(p) {
        c.globalCompositeOperation = "destination-out"; c.lineWidth = 46; c.lineCap = "round";
        c.beginPath(); c.moveTo((last || p).x, (last || p).y); c.lineTo(p.x, p.y); c.stroke();
        last = p; if (++strokes % 8 === 0) check();
      }
      function check() {
        const { width: w, height: h } = cv, data = c.getImageData(0, 0, w, h).data; let clear = 0, tot = 0;
        for (let i = 3; i < data.length; i += 4 * 24) { tot++; if (data[i] < 40) clear++; }
        if (clear / tot > .45) reveal();
      }
      cv.addEventListener("pointerdown", e => { drawing = true; last = null; cv.setPointerCapture(e.pointerId); scratchAt(pos(e)); });
      cv.addEventListener("pointermove", e => { if (drawing) scratchAt(pos(e)); });
      ["pointerup", "pointercancel", "pointerleave"].forEach(t => cv.addEventListener(t, () => { drawing = false; last = null; }));
      $("#revealAlt").addEventListener("click", reveal);

      function parts_() {
        let ms = Math.max(0, target - Date.now());
        const d = Math.floor(ms / 864e5); ms -= d * 864e5; const h = Math.floor(ms / 36e5); ms -= h * 36e5; const m = Math.floor(ms / 6e4); const s = Math.floor((ms - m * 6e4) / 1e3);
        return [d, h, m, s];
      }
      const fmt = (n, i) => String(n).padStart(i === 0 && n > 99 ? 3 : 2, "0");
      function show() { parts_().forEach((v, i) => nums[i].textContent = fmt(v, i)); }
      show();

      function reveal() {
        if (revealed) return; revealed = true; card.classList.add("revealed");
        const r = card.getBoundingClientRect(), bx = r.left + r.width / 2, by = r.top + r.height / 2;
        const finish = () => {
          nums.forEach(n => n.parentElement.classList.remove("rolling")); show();
          if (target - Date.now() <= 0) card.classList.add("done-day");
          if (window.WeddingAudio) window.WeddingAudio.playTempleChime();
          burst({ x: bx, y: by, n: 160 }); setTimeout(() => burst({ rain: true, n: 80 }), 350);
          setInterval(show, 1000);
        };
        if (reduce) { finish(); return; }
        const t0 = performance.now(), max = [400, 24, 60, 60];
        nums.forEach(n => n.parentElement.classList.add("rolling"));
        let lastTick = 0;
        (function roll(t) {
          const k = (t - t0) / 1600;
          if (t - lastTick > 75) {
            lastTick = t;
            if (window.WeddingAudio) window.WeddingAudio.playShuffleTick();
          }
          nums.forEach((n, i) => { if (k < .55 + i * .12) n.textContent = fmt(Math.floor(Math.random() * max[i]), i); else if (n.parentElement.classList.contains("rolling")) { n.parentElement.classList.remove("rolling"); n.textContent = fmt(parts_()[i], i); } });
          if (k < 1) requestAnimationFrame(roll); else finish();
        })(t0);
      }
    }

    /* ---------- stacking event cards ---------- */
    function setupStack() {
      const cards = [...document.querySelectorAll(".ev")];
      const base = 64, step = 18;
      function layout() {
        cards.forEach((el, i) => {
          // short cards pin near the top; tall cards pin by their bottom edge so the whole card is read first
          const top = Math.min(base + i * step, innerHeight - el.offsetHeight - 16);
          el.classList.toggle("sticky", !reduce);
          el.style.top = top + "px";
        });
      }
      function onScroll() {
        cards.forEach((el, i) => {
          const next = cards[i + 1];
          if (!next || !el.classList.contains("sticky")) { el.style.transform = ""; el.style.filter = ""; return; }
          const r = el.getBoundingClientRect(), nr = next.getBoundingClientRect();
          const p = Math.min(1, Math.max(0, (r.bottom - nr.top) / r.height));
          el.style.transform = `scale(${1 - p * .07})`;
          el.style.filter = `brightness(${1 - p * .12})`;
        });
      }
      layout(); addEventListener("resize", () => { layout(); onScroll(); });
      let ticking = false; addEventListener("scroll", () => { if (!ticking) { ticking = true; requestAnimationFrame(() => { onScroll(); ticking = false; }); } }, { passive: true });
    }

    loadData().then(render);
  })();
</script>
